name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    if: github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/ci.yml

  prepare:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Validate release requirements
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          for variable in OPENAI_API_KEY APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            test -n "${!variable}" || { echo "Add the $variable Actions secret." >&2; exit 1; }
          done
      - name: Prepare version once for all platforms
        id: version
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: bun scripts/release-ci.js prepare
      - name: Check for an existing release
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "This release already exists. Inspect or remove its draft before retrying." >&2
            exit 1
          fi
      - name: Generate release notes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          bun scripts/release-ci.js notes
          cat docs/platform-support.md >> dist/RELEASE_NOTES.md
      - name: Preserve versioned build inputs
        uses: actions/upload-artifact@v7
        with:
          name: release-inputs
          path: |
            Cargo.toml
            Cargo.lock
            package.json
            apps/tendkit/macos/Info.plist
            dist/RELEASE_NOTES.md

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            os: macos
            arch: arm64
          - runner: macos-15-intel
            os: macos
            arch: x64
          - runner: windows-2025
            os: windows
            arch: x64
          - runner: ubuntu-24.04
            os: linux
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: release-inputs
          path: .
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake pkg-config protobuf-compiler libasound2-dev libclang-dev libfontconfig1-dev libfreetype6-dev libx11-xcb-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev libzstd-dev libssl-dev libxcb-xfixes0-dev libxcb-shape0-dev libxcb-render0-dev libxrandr-dev libxi-dev
      - name: Install Windows build dependencies
        if: matrix.os == 'windows'
        run: choco install protoc --yes --no-progress
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.os }}-${{ matrix.arch }}
      - name: Build macOS application
        if: matrix.os == 'macos'
        run: bun run build
      - name: Build Windows and Linux applications
        if: matrix.os != 'macos'
        run: cargo build --locked --release -p tendkit -p tendkit-engine
      - name: Smoke test native engine protocol
        run: bun scripts/smoke-engine.js
      - name: Sign and notarize macOS application
        if: matrix.os == 'macos'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash scripts/notarize-app.sh
      - name: Package native applications
        run: bun scripts/package-release.js package
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/TendKit-*.zip
            dist/TendKit-*.tar.gz
            dist/TendKit-*.deb

  publish:
    needs: [test, prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@v8
        with:
          name: release-inputs
          path: .
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*-*
          merge-multiple: true
          path: dist
      - name: Verify platform matrix and generate combined checksums
        run: bun scripts/package-release.js finalize
      - name: Publish GitHub release
        run: |
          gh release create "$RELEASE_TAG" dist/TendKit-*.zip dist/TendKit-*.tar.gz dist/TendKit-*.deb dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --title "TendKit ${RELEASE_TAG#v}" \
            --notes-file dist/RELEASE_NOTES.md --draft
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
