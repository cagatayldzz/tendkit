name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Cheap checks need no macOS runner and finish while the macOS jobs build.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: rustup default stable
      - name: Test release automation
        run: bun test scripts
      - name: Check workspace layers
        run: bun scripts/layers.ts
      - name: Check formatting
        run: cargo fmt --all -- --check

  # Everything except the GPUI crates is plain Rust and builds on Linux in seconds,
  # without waiting for a macOS runner.
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: rustup default stable
      # shellrc's tests source a generated file in a real zsh.
      - run: sudo apt-get install -y --no-install-recommends zsh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint
        run: cargo clippy --locked --workspace --exclude tendkit --exclude tendkit-ui --exclude tendkit-model --all-targets -- -D warnings
      - name: Test
        run: |
          cargo build --locked -p tendkit-engine
          cargo test --locked --workspace --exclude tendkit --exclude tendkit-ui --exclude tendkit-model

  # The GPUI crates (model, ui, and the app) need macOS, the only platform TendKit
  # ships on. One job instead of two means waiting for one macOS runner, not two.
  app:
    # TendKit targets Apple Silicon only, so build on the same architecture.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: rustup default stable
      # Caches dependencies only, keyed by toolchain and Cargo.lock, so a push
      # that changes TendKit sources restores the cache without re-saving it.
      # Pull requests read the cache that main builds.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: app
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint
        run: cargo clippy --locked -p tendkit -p tendkit-ui -p tendkit-model --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked -p tendkit -p tendkit-ui -p tendkit-model
