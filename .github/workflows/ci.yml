name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every push runs lightweight checks and core Rust tests on Ubuntu only.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: rustup default stable
      - name: Test release automation
        run: bash scripts/tests/run.sh
      - name: Check formatting
        run: cargo fmt --all -- --check

  # Everything except the GPUI crates is plain Rust and builds on Linux in seconds,
  # without waiting for a macOS runner.
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: rustup default stable
      # shellrc's tests source a generated file in a real zsh.
      - name: Install test dependencies
        run: |
          # A refreshed package index and a few retries keep a flaky Ubuntu mirror from failing the job.
          command -v zsh >/dev/null 2>&1 && exit 0
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh; then exit 0; fi
            echo "apt-get failed (attempt $attempt of 3)." >&2
            sleep 10
          done
          exit 1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint
        run: cargo clippy --locked --workspace --exclude tendkit --exclude tendkit-ui --exclude tendkit-model --all-targets -- -D warnings
      - name: Test
        run: |
          cargo build --locked -p tendkit-engine
          cargo test --locked --workspace --exclude tendkit --exclude tendkit-ui --exclude tendkit-model

  # The GPUI crates need a native runner. CI only needs them to compile and pass their tests,
  # not fast or debuggable code: no debug info for this workspace's crates, and unoptimized
  # dependencies (the development profile optimizes them for the application's sake).
  interface:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CI_CARGO_FLAGS: --locked --config profile.dev.package."*".opt-level=0 --config profile.dev.package."*".debug=false
    steps:
      - uses: actions/checkout@v6
      - run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: interface-fast
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # A failing test must not leave the next run with a cold cache.
          cache-on-failure: true
          cache-workspace-crates: true
      # One build profile for every step: `cargo clippy` after `cargo test` would compile each dependency twice.
      - name: Build the interface crates
        run: cargo test $CI_CARGO_FLAGS -p tendkit -p tendkit-ui -p tendkit-model --no-run
      - name: Test
        run: cargo test $CI_CARGO_FLAGS -p tendkit -p tendkit-ui -p tendkit-model

  # Windows builds the whole workspace, application included, so a change that only breaks
  # the Windows build is caught before a release.
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CI_CARGO_FLAGS: --locked --config profile.dev.package."*".opt-level=0 --config profile.dev.package."*".debug=false
    steps:
      - uses: actions/checkout@v6
      - run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
        shell: bash
      - name: Install Windows build dependencies
        shell: bash
        run: choco install protoc --yes --no-progress
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-fast
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Build the application and the engine
        shell: bash
        run: cargo build $CI_CARGO_FLAGS -p tendkit-engine -p tendkit
      - name: Test the Windows-relevant packages
        shell: bash
        run: cargo test $CI_CARGO_FLAGS -p tendkit-client -p tendkit-storage -p tendkit-protocol -p tendkit-updater -p tendkit-version -p tendkit-i18n
