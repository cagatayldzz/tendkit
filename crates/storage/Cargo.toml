[package]
name = "tendkit-storage"

# Register tests as unit modules so they can exercise private implementation details.
autotests = false
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "TendKit per-user files: paths, caches, window size, and OpenCommit configuration"

[package.metadata.layers]
# Layer check (`bun run check:layers`): the dependencies this package may use.
dependencies = ["serde", "serde_json", "libc"]

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
serde.workspace = true
serde_json.workspace = true

[[test]]
name = "files"
path = "tests/files.rs"
