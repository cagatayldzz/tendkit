[package]
name = "tendkit-ui"

# Register tests as unit modules so they can exercise private implementation details.
autotests = false
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "TendKit interface views built with GPUI Kit"

[package.metadata.layers]
# Layer check (`bun run check:layers`): the dependencies this package may use.
dependencies = ["tendkit-i18n", "tendkit-model", "tendkit-protocol", "tendkit-storage", "tendkit-updater", "gpui-kit", "gpui-kit-assets", "libc", "objc2-foundation", "objc2-app-kit"]

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
tendkit-i18n.workspace = true
tendkit-model.workspace = true
tendkit-protocol.workspace = true
tendkit-storage.workspace = true
tendkit-updater.workspace = true
gpui-kit.workspace = true
gpui-kit-assets.workspace = true
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSString", "NSError"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication"] }
